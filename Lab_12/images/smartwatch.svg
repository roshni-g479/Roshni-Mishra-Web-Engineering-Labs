<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Watch Straps -->
  <rect x="130" y="20" width="40" height="45" rx="5" fill="#34495e"/>
  <rect x="130" y="135" width="40" height="45" rx="5" fill="#34495e"/>
  <!-- Watch Body -->
  <rect x="110" y="55" width="80" height="90" rx="20" fill="#2c3e50"/>
  <!-- Watch Screen -->
  <rect x="118" y="63" width="64" height="74" rx="14" fill="#1a252f"/>
  <!-- Screen Elements -->
  <text x="150" y="98" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2ecc71" text-anchor="middle">10:45</text>
  <path d="M 130 115 L 140 115 L 145 105 L 152 122 L 158 112 L 163 115 L 170 115" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Button -->
