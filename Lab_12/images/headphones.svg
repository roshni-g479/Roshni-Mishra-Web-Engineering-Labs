<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Headphone Arc -->
  <path d="M 80 120 A 70 70 0 0 1 220 120" fill="none" stroke="#2c3e50" stroke-width="12" stroke-linecap="round"/>
  <!-- Headband Cushion -->
  <path d="M 100 85 A 60 50 0 0 1 200 85" fill="none" stroke="#2980b9" stroke-width="8" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <rect x="70" y="105" width="22" height="48" rx="10" fill="#2980b9"/>
  <rect x="62" y="112" width="12" height="34" rx="5" fill="#34495e"/>
  <!-- Right Ear Cup -->
  <rect x="208" y="105" width="22" height="48" rx="10" fill="#2980b9"/>
  <rect x="226" y="112" width="12" height="34" rx="5" fill="#34495e"/>
  <!-- Label -->
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">Wireless Headphones</text>
</svg>