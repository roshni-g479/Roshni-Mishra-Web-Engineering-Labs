<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Charger Main Body -->
  <rect x="90" y="55" width="100" height="85" rx="10" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  <!-- Prongs -->
  <rect x="190" y="70" width="25" height="12" rx="2" fill="#7f8c8d"/>
  <rect x="190" y="105" width="25" height="12" rx="2" fill="#7f8c8d"/>
  <!-- USB-C Port 1 -->
  <rect x="105" y="75" width="22" height="10" rx="4" fill="#34495e"/>
  <!-- USB-C Port 2 -->
  <rect x="105" y="100" width="22" height="10" rx="4" fill="#2980b9"/>
  <!-- 65W Text -->
  <text x="155" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">65W</text>
  <!-- Label -->
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">Fast Charger (GaN)</text>
</svg>