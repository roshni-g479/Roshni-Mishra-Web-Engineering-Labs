<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Keyboard Base -->
  <rect x="40" y="55" width="220" height="95" rx="8" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <!-- Key rows -->
  <!-- Row 1 -->
  <g fill="#34495e">
    <rect x="52" y="65" width="16" height="12" rx="2"/><rect x="72" y="65" width="16" height="12" rx="2"/>
    <rect x="92" y="65" width="16" height="12" rx="2"/><rect x="112" y="65" width="16" height="12" rx="2"/>
    <rect x="132" y="65" width="16" height="12" rx="2"/><rect x="152" y="65" width="16" height="12" rx="2"/>
    <rect x="172" y="65" width="16" height="12" rx="2"/><rect x="192" y="65" width="16" height="12" rx="2"/>
    <rect x="212" y="65" width="16" height="12" rx="2"/><rect x="232" y="65" width="16" height="12" rx="2"/>
  </g>
  <!-- Row 2 -->
  <g fill="#34495e">
    <rect x="52" y="82" width="16" height="12" rx="2"/><rect x="72" y="82" width="16" height="12" rx="2"/>
    <rect x="92" y="82" width="16" height="12" rx="2"/><rect x="112" y="82" width="16" height="12" rx="2"/>
    <rect x="132" y="82" width="16" height="12" rx="2"/><rect x="152" y="82" width="16" height="12" rx="2"/>
    <rect x="172" y="82" width="16" height="12" rx="2"/><rect x="192" y="82" width="16" height="12" rx="2"/>
    <rect x="212" y="82" width="16" height="12" rx="2"/><rect x="232" y="82" width="16" height="12" rx="2"/>
  </g>
  <!-- Row 3 (WASD in light blue) -->
  <g fill="#34495e">
    <rect x="52" y="99" width="18" height="12" rx="2"/>
    <rect x="74" y="99" width="16" height="12" rx="2" fill="#2980b9"/>
    <rect x="94" y="99" width="16" height="12" rx="2" fill="#2980b9"/>
    <rect x="114" y="99" width="16" height="12" rx="2" fill="#2980b9"/>
    <rect x="134" y="99" width="16" height="12" rx="2"/><rect x="154" y="99" width="16" height="12" rx="2"/>
    <rect x="174" y="99" width="16" height="12" rx="2"/><rect x="194" y="99" width="16" height="12" rx="2"/>
    <rect x="214" y="99" width="34" height="12" rx="2"/>
  </g>
  <!-- Spacebar row -->
  <rect x="52" y="116" width="22" height="12" rx="2" fill="#34495e"/>
  <rect x="78" y="116" width="22" height="12" rx="2" fill="#34495e"/>
  <rect x="104" y="116" width="92" height="12" rx="2" fill="#3498db"/>
  <rect x="200" y="116" width="22" height="12" rx="2" fill="#34495e"/>
  <rect x="226" y="116" width="22" height="12" rx="2" fill="#34495e"/>
  <!-- Label -->
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">Mechanical Keyboard</text>
</svg>