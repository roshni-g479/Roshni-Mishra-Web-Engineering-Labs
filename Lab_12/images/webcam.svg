<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Webcam Monitor Clip Stand -->
  <path d="M 140 120 L 140 150 L 120 155 L 180 155" fill="none" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
  <!-- Camera Pill Body -->
  <rect x="80" y="70" width="140" height="50" rx="20" fill="#2c3e50"/>
  <!-- Outer Lens Ring -->
  <circle cx="150" cy="95" r="20" fill="#34495e" stroke="#1abc9c" stroke-width="2"/>
  <!-- Inner Lens Glass -->
  <circle cx="150" cy="95" r="12" fill="#1a252f"/>
  <circle cx="153" cy="92" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- LED Indicator -->
  <circle cx="185" cy="95" r="3" fill="#2ecc71"/>
  <!-- Label -->
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">1080p HD Web Camera</text>
</svg>