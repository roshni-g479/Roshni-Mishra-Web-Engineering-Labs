<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Mouse Body -->
  <path d="M 115 150 C 105 130 105 75 125 50 C 135 38 165 38 175 50 C 195 75 195 130 185 150 C 175 165 125 165 115 150 Z" fill="#2c3e50"/>
  <!-- Left/Right Button Divider -->
  <line x1="150" y1="42" x2="150" y2="85" stroke="#1a252f" stroke-width="2"/>
  <!-- Scroll Wheel -->
  <rect x="145" y="55" width="10" height="20" rx="5" fill="#3498db"/>
  <!-- RGB Accent Lines -->
  <path d="M 120 120 Q 150 145 180 120" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <circle cx="150" cy="115" r="7" fill="#f1c40f"/>
  <!-- Cable -->
  <path d="M 150 42 C 150 25 160 20 170 15" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <!-- Label -->
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">Gaming Optical Mouse</text>
</svg>