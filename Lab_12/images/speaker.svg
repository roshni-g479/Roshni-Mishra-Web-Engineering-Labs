<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Speaker Cylinder Body -->
  <rect x="75" y="60" width="150" height="80" rx="25" fill="#2c3e50"/>
  <!-- Speaker Grill mesh dots -->
  <g fill="#7f8c8d" opacity="0.6">
    <circle cx="100" cy="80" r="3"/><circle cx="115" cy="80" r="3"/><circle cx="130" cy="80" r="3"/><circle cx="145" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="175" cy="80" r="3"/><circle cx="190" cy="80" r="3"/><circle cx="200" cy="80" r="3"/>
    <circle cx="100" cy="95" r="3"/><circle cx="115" cy="95" r="3"/><circle cx="130" cy="95" r="3"/><circle cx="145" cy="95" r="3"/><circle cx="160" cy="95" r="3"/><circle cx="175" cy="95" r="3"/><circle cx="190" cy="95" r="3"/><circle cx="200" cy="95" r="3"/>
    <circle cx="100" cy="110" r="3"/><circle cx="115" cy="110" r="3"/><circle cx="130" cy="110" r="3"/><circle cx="145" cy="110" r="3"/><circle cx="160" cy="110" r="3"/><circle cx="175" cy="110" r="3"/><circle cx="190" cy="110" r="3"/><circle cx="200" cy="110" r="3"/>
    <circle cx="100" cy="125" r="3"/><circle cx="115" cy="125" r="3"/><circle cx="130" cy="125" r="3"/><circle cx="145" cy="125" r="3"/><circle cx="160" cy="125" r="3"/><circle cx="175" cy="125" r="3"/><circle cx="190" cy="125" r="3"/><circle cx="200" cy="125" r="3"/>
  </g>
  <!-- Buttons on top -->
  <circle cx="130" cy="60" r="4" fill="#3498db"/>
  <circle cx="150" cy="60" r="4" fill="#e74c3c"/>
  <circle cx="170" cy="60" r="4" fill="#2ecc71"/>
  <!-- Label -->
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">Bluetooth Speaker</text>
</svg>